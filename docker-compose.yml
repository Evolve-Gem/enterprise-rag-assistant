# Enterprise RAG Copilot — 一键启动（web + backend，可选 pgvector / legacy）
#
# 本地开发：
#   docker compose up --build                      # web:3001 + backend:8000
#   docker compose --profile pg up                 # 额外启动 PostgreSQL + pgvector
#   docker compose --profile legacy up             # 额外启动 legacy Streamlit 演示
#
# 生产 Demo（默认只起 backend + web，不启用 pgvector / legacy）：
#   1. 在仓库根目录创建服务器专用 .env（不要提交 Git）
#      —— 模板见 .env.production.example，必须设置 DEMO_PASSWORD 与 DEMO_READ_ONLY=true
#   2. docker compose up -d --build
#   3. docker compose ps && docker compose logs -f
#
# 环境变量来源：compose 变量替换读取本目录的 .env；容器运行时变量由
# `env_file: .env` 注入。真实密钥只存在于服务器上的 .env。

name: enterprise-rag-copilot

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      # PIP_INDEX_URL / NPM_REGISTRY default empty (upstream). A host whose route
      # to PyPI / npm is slow can set them in .env to a regional mirror; the
      # values are interpolated here and passed as build args (see each
      # Dockerfile). They are build-time only and never appear in the bundle.
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-}"
    image: rag-copilot-backend:3.0.0
    env_file:
      - .env
    environment:
      # Inside the compose network the frontend talks to `backend:8000`, and the
      # browser talks to the published port.
      ENVIRONMENT: production
      # These three MUST be pinned here. `env_file: .env` also injects the values
      # from the host file, and service-level `environment` wins over `env_file`.
      # Without this, a `.env` that carries an empty `KB_DIR=` (the example file
      # ships them empty) would blank out the image ENV, the app would fall back
      # to the in-image default `/app/backend/knowledge_base`, and the service
      # would come up healthy with ZERO documents indexed.
      KB_DIR: /app/knowledge_base
      PROMPTS_DIR: /app/prompts
      DATA_DIR: /app/backend/data
      # Same-origin in production (Nginx routes /api to this service), so CORS is
      # only relevant when the API is called from a different origin directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      # Optional: point the vector store at the pg service (profile "pg").
      VECTOR_STORE: ${VECTOR_STORE:-numpy}
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      # Bound to loopback on purpose: the web service proxies /api and /health
      # to this container over the compose network, so the API never needs a
      # public port. Change the host port only if something else on the box
      # already listens on 18000 (for example a gunicorn app).
      - "127.0.0.1:${BACKEND_HOST_PORT:-18000}:8000"
    volumes:
      # Keep the index cache / activity ledger across restarts, and allow
      # uploading documents without rebuilding the image.
      - backend-data:/app/backend/data
      - ./knowledge_base:/app/knowledge_base
    # A demo box has a small disk; without a cap the json-file driver grows
    # until the volume fills and every service starts failing.
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Baked into the client bundle at build time, so this MUST stay empty in
        # production: an empty base means "same origin", and the browser then
        # calls /api and /health on whatever host served the page, which Next
        # proxies to API_PROXY_TARGET.
        #
        # The `-` (not `:-`) is deliberate. `${VAR:-default}` substitutes the
        # default when the value is empty OR unset, so a production .env that
        # sets `NEXT_PUBLIC_API_BASE_URL=` (empty, as the template does) would
        # silently become http://localhost:8000 and bake localhost into the
        # bundle. `${VAR-default}` only substitutes when the variable is unset,
        # which is exactly the semantics we want:
        #   unset        -> ""
        #   set to ""    -> ""
        #   set to a URL -> that URL
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL-}"
        # See the backend service: a regional npm mirror, build-time only.
        NPM_REGISTRY: "${NPM_REGISTRY:-}"
    image: rag-copilot-web:3.0.0
    environment:
      PORT: "3001"
      # Runtime proxy target for /api and /health (see next.config.ts). Because
      # it is read at server start, changing this needs only a restart — no
      # image rebuild — which is what makes the IP phase and the domain phase
      # share one build.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
    ports:
      # The only publicly reachable port. Nginx (phase B) proxies to this one.
      - "${WEB_HOST_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
    stop_grace_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------- optional
  db:
    image: pgvector/pgvector:pg16
    profiles: ["pg"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot} -d ${POSTGRES_DB:-copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  legacy:
    build:
      context: .
      dockerfile: legacy/Dockerfile
    image: rag-copilot-legacy:2.0.0
    profiles: ["legacy"]
    env_file:
      - .env
    ports:
      - "8502:8501"
    restart: unless-stopped

volumes:
  backend-data:
  pg-data:
